<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo','Helvetica Neue',Arial,sans-serif" font-size="13">
<rect width="1000" height="740" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs>
<text x="20" y="26" font-size="15" font-weight="bold">Pipeline flow and the options that matter at each stage</text>
<rect x="20" y="44" width="340" height="76" rx="6" fill="#eef4fb" stroke="#444" stroke-width="1.2"/>
<text x="190.0" y="68.0" text-anchor="middle" font-size="13" font-weight="bold">1. Input</text>
<text x="190.0" y="86.0" text-anchor="middle" font-size="13">Cell Ranger filtered_feature_bc_matrix</text>
<text x="190.0" y="104.0" text-anchor="middle" font-size="13">+ GTF + species marker table</text>
<line x1="360" y1="82" x2="388" y2="82" stroke="#999" stroke-dasharray="3,3"/>
<text x="394" y="68" font-family="monospace" font-size="12" fill="#222">--cellranger-dir  --sample-id  --gtf  --gtf-gene-id auto</text>
<text x="394" y="86" font-family="monospace" font-size="12" fill="#222">--chromosome-map  --mito-chromosome  --markers {dog|human|mouse|CSV}</text>
<text x="394" y="104" font-family="monospace" font-size="12" fill="#222">--preflight-only (check the inputs, then stop)</text>
<line x1="190" y1="120" x2="190" y2="144" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="20" y="144" width="340" height="76" rx="6" fill="#eef4fb" stroke="#444" stroke-width="1.2"/>
<text x="190.0" y="168.0" text-anchor="middle" font-size="13" font-weight="bold">2. Preprocessing / QC</text>
<text x="190.0" y="186.0" text-anchor="middle" font-size="13">HVG/PCA, coarse clusters, cell types</text>
<text x="190.0" y="204.0" text-anchor="middle" font-size="13">mtDNA check, MAD QC, doublets</text>
<line x1="360" y1="182" x2="388" y2="182" stroke="#999" stroke-dasharray="3,3"/>
<text x="394" y="168" font-family="monospace" font-size="12" fill="#222">--n-hvg  --n-pcs  --leiden-resolution</text>
<text x="394" y="186" font-family="monospace" font-size="12" fill="#222">--marker-rule  --marker-min-margin  --marker-min-within-z</text>
<text x="394" y="204" font-family="monospace" font-size="12" fill="#222">--no-pctmt-filter  --expected-doublet-rate  --skip-doublet-rescue</text>
<line x1="190" y1="220" x2="190" y2="244" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="20" y="244" width="340" height="76" rx="6" fill="#eef4fb" stroke="#444" stroke-width="1.2"/>
<text x="190.0" y="268.0" text-anchor="middle" font-size="13" font-weight="bold">3. Metacells</text>
<text x="190.0" y="286.0" text-anchor="middle" font-size="13">Group similar cells to reduce noise</text>
<text x="190.0" y="304.0" text-anchor="middle" font-size="13">(own implementation, no SEACells package)</text>
<line x1="360" y1="282" x2="388" y2="282" stroke="#999" stroke-dasharray="3,3"/>
<text x="394" y="277" font-family="monospace" font-size="12" fill="#222">--cells-per-metacell  --metacell-seed</text>
<text x="394" y="295" font-family="monospace" font-size="12" fill="#222">--seacell-assignments auto (reuse existing assignments)</text>
<line x1="190" y1="320" x2="190" y2="344" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="20" y="344" width="340" height="76" rx="6" fill="#eef4fb" stroke="#444" stroke-width="1.2"/>
<text x="190.0" y="368.0" text-anchor="middle" font-size="13" font-weight="bold">4. CNV inference</text>
<text x="190.0" y="386.0" text-anchor="middle" font-size="13">Windowed running mean of the difference</text>
<text x="190.0" y="404.0" text-anchor="middle" font-size="13">from the reference (the reference sets the meaning; Fig. 2)</text>
<line x1="360" y1="382" x2="388" y2="382" stroke="#999" stroke-dasharray="3,3"/>
<text x="394" y="368" font-family="monospace" font-size="12" fill="#222">--cnv-reference {celltype|none|external†}</text>
<text x="394" y="386" font-family="monospace" font-size="12" fill="#222">--normal-celltype  --normal-clusters  --cnv-refine</text>
<text x="394" y="404" font-family="monospace" font-size="12" fill="#222">--cnv-method {infercnv|bins}  --cnv-external-reference†</text>
<line x1="190" y1="420" x2="190" y2="444" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="20" y="444" width="340" height="76" rx="6" fill="#eef4fb" stroke="#444" stroke-width="1.2"/>
<text x="190.0" y="468.0" text-anchor="middle" font-size="13" font-weight="bold">5. Malignant call</text>
<text x="190.0" y="486.0" text-anchor="middle" font-size="13">Per CNV clone (cnv_leiden):</text>
<text x="190.0" y="504.0" text-anchor="middle" font-size="13">malignant or normal</text>
<line x1="360" y1="482" x2="388" y2="482" stroke="#999" stroke-dasharray="3,3"/>
<text x="394" y="477" font-family="monospace" font-size="12" fill="#222">--malignant-call {auto|reference|gap|median}</text>
<text x="394" y="495" font-family="monospace" font-size="12" fill="#222">--malignant-n-sd 3.0  --min-clone-gap 0.25</text>
<line x1="190" y1="520" x2="190" y2="544" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="20" y="544" width="340" height="76" rx="6" fill="#eef4fb" stroke="#444" stroke-width="1.2"/>
<text x="190.0" y="577.0" text-anchor="middle" font-size="13" font-weight="bold">6. Annotation, lineage, DE</text>
<text x="190.0" y="595.0" text-anchor="middle" font-size="13">Metacell annotation (anno_label), lineage (Dollo), DE</text>
<line x1="360" y1="582" x2="388" y2="582" stroke="#999" stroke-dasharray="3,3"/>
<text x="394" y="568" font-family="monospace" font-size="12" fill="#222">--lineage  --lineage-level  --lineage-events</text>
<text x="394" y="586" font-family="monospace" font-size="12" fill="#222">--no-metacell-annotation (anno_label is on by default; Sec. 6.4)</text>
<text x="394" y="604" font-family="monospace" font-size="12" fill="#222">--sample-kind† {auto|tissue|cell-line} (whether to run DE)</text>
<line x1="190" y1="620" x2="190" y2="644" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="20" y="644" width="340" height="76" rx="6" fill="#eef4fb" stroke="#444" stroke-width="1.2"/>
<text x="190.0" y="668.0" text-anchor="middle" font-size="13" font-weight="bold">7. Output / plots</text>
<text x="190.0" y="686.0" text-anchor="middle" font-size="13">metacell_obs.csv etc. (Table 3), scanpy/ (UMAP)</text>
<text x="190.0" y="704.0" text-anchor="middle" font-size="13">figures and report: metacellcnv_visualize.py</text>
<line x1="360" y1="682" x2="388" y2="682" stroke="#999" stroke-dasharray="3,3"/>
<text x="394" y="677" font-family="monospace" font-size="12" fill="#222">--results-dir  --engine {plotly|matplotlib|both}</text>
<text x="394" y="695" font-family="monospace" font-size="12" fill="#222">--no-scanpy  --scanpy-dir (UMAP / QC tables go to &lt;out-dir&gt;/scanpy)</text>
</svg>
