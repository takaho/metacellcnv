<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo','Helvetica Neue',Arial,sans-serif" font-size="13">
<rect width="1000" height="780" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs>
<text x="20" y="26" font-size="15" font-weight="bold">Choosing a reference for your sample, and what the output then means</text>
<rect x="20" y="50" width="380" height="74" rx="6" fill="#f7f7f7" stroke="#444" stroke-width="1.2"/>
<text x="210.0" y="82.0" text-anchor="middle" font-size="13">Q1  Does the sample contain enough normal cells</text>
<text x="210.0" y="100.0" text-anchor="middle" font-size="13">that markers can identify (immune, endothelial, ...)?</text>
<line x1="400" y1="87.0" x2="470" y2="87.0" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="408" y="81.0" font-size="12" fill="#b22">yes</text>
<rect x="470" y="50" width="510" height="74" rx="6" fill="#e8f5e9" stroke="#444" stroke-width="1.2"/>
<text x="725.0" y="73.0" text-anchor="middle" font-size="13" font-weight="bold">A. Default: --cnv-reference celltype</text>
<text x="725.0" y="91.0" text-anchor="middle" font-size="13">Threshold from cnv_score of the normal reference metacells (reference method)</text>
<text x="725.0" y="109.0" text-anchor="middle" font-size="13">-&gt; Read as absolute CNV (gain/loss relative to the reference)</text>
<line x1="210.0" y1="124" x2="210.0" y2="190" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="218.0" y="161.0" font-size="12" fill="#b22">no</text>
<rect x="20" y="190" width="380" height="74" rx="6" fill="#f7f7f7" stroke="#444" stroke-width="1.2"/>
<text x="210.0" y="222.0" text-anchor="middle" font-size="13">Q2  Are there clusters known to be normal</text>
<text x="210.0" y="240.0" text-anchor="middle" font-size="13">even though markers cannot identify them?</text>
<line x1="400" y1="227.0" x2="470" y2="227.0" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="408" y="221.0" font-size="12" fill="#b22">yes</text>
<rect x="470" y="190" width="510" height="74" rx="6" fill="#fff8e1" stroke="#444" stroke-width="1.2"/>
<text x="725.0" y="213.0" text-anchor="middle" font-size="13" font-weight="bold">B. --normal-clusters 3,7 / --normal-celltype Fibroblast</text>
<text x="725.0" y="231.0" text-anchor="middle" font-size="13">Use the clusters you name as the reference</text>
<text x="725.0" y="249.0" text-anchor="middle" font-size="13">-&gt; Read as in A, but 'normal' is your responsibility</text>
<line x1="210.0" y1="264" x2="210.0" y2="330" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="218.0" y="301.0" font-size="12" fill="#b22">no</text>
<rect x="20" y="330" width="380" height="74" rx="6" fill="#f7f7f7" stroke="#444" stroke-width="1.2"/>
<text x="210.0" y="362.0" text-anchor="middle" font-size="13">Q3  Can you prepare several other samples</text>
<text x="210.0" y="380.0" text-anchor="middle" font-size="13">from the same experiment and conditions?</text>
<line x1="400" y1="367.0" x2="470" y2="367.0" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="408" y="361.0" font-size="12" fill="#b22">yes</text>
<rect x="470" y="330" width="510" height="74" rx="6" fill="#fff3e0" stroke="#444" stroke-width="1.2"/>
<text x="725.0" y="353.0" text-anchor="middle" font-size="13" font-weight="bold">C. Annotated substitute: build a reference from other samples</text>
<text x="725.0" y="371.0" text-anchor="middle" font-size="13">--cnv-reference external† --cnv-external-reference† &lt;CSV&gt;</text>
<text x="725.0" y="389.0" text-anchor="middle" font-size="13">-&gt; Medium accuracy; between-sample shifts leak in, so annotate</text>
<line x1="210.0" y1="404" x2="210.0" y2="470" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="218.0" y="441.0" font-size="12" fill="#b22">no</text>
<rect x="20" y="470" width="380" height="74" rx="6" fill="#f7f7f7" stroke="#444" stroke-width="1.2"/>
<text x="210.0" y="511.0" text-anchor="middle" font-size="13">Q4  None of these (tumor-only, a single cell line, ...)</text>
<line x1="400" y1="507.0" x2="470" y2="507.0" stroke="#444" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="470" y="470" width="510" height="74" rx="6" fill="#fdecea" stroke="#444" stroke-width="1.2"/>
<text x="725.0" y="493.0" text-anchor="middle" font-size="13" font-weight="bold">D. --cnv-reference none --sample-kind† cell-line</text>
<text x="725.0" y="511.0" text-anchor="middle" font-size="13">Baseline = mean of all metacells; uniform clonal CNV cancels out</text>
<text x="725.0" y="529.0" text-anchor="middle" font-size="13">-&gt; Only relative differences between subclones; no absolute CNV</text>
<rect x="20" y="580" width="960" height="170" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.2"/>
<text x="500.0" y="624.0" text-anchor="middle" font-size="13" font-weight="bold">Common cautions</text>
<text x="500.0" y="642.0" text-anchor="middle" font-size="13">- Using only public data as the reference is treated like C, with even lower accuracy (Figs. 3, 4)</text>
<text x="500.0" y="660.0" text-anchor="middle" font-size="13">- C and D contain 'undetermined' regions. Never read undetermined as 'no CNV' (Sec. 7)</text>
<text x="500.0" y="678.0" text-anchor="middle" font-size="13">- Even in A and B, a small reference (e.g. 24) makes the threshold unstable. Check the reference count and cnv_score distribution (Sec. 6)</text>
<text x="500.0" y="696.0" text-anchor="middle" font-size="13">- A metacell called 'normal' means 'indistinguishable from the reference', not 'confirmed normal'</text>
<text x="500.0" y="714.0" text-anchor="middle" font-size="13">† = working-version option, not yet in the public repository (as of 2026-09-17)</text>
</svg>
